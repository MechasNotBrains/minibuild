[project]
name = "minibuild"
version = "0.0.0"
description = "Minimalist Buildsystem for C and C++"
keywords = ["buildsystem", "C", "Cpp", "minimal", "simple"]
license = "GPL-3.0-or-later"
authors = [ {name = "Ivan Mar (.sOkam!)"} ]
readme = "readme.md"
requires-python = ">= 3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
# Homepage = "https://example.com"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/heysokam/minibuild.git"
Issues = "https://github.com/heysokam/minibuild/issues"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
minibuild = "src"

[tool.pytest.ini_options]
addopts = [ "--import-mode=importlib" ]

